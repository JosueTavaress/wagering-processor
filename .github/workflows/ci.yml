name: verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: docker compose --profile test run --build --rm --no-deps tests bun run format:check
      - name: Unit, integration and concurrency with real containers
        run: docker compose --profile test run --build --rm tests
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup disposable CI environment
        if: always()
        run: docker compose down -v
